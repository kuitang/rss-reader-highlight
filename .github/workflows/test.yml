name: RSS Reader Test Suite

on:
  schedule:
    - cron: '43 5 * * 2'
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11.17"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install -e .
        python - <<'PYLOCK'
        from importlib.metadata import version
        from pathlib import Path
        from pip._vendor.packaging.requirements import Requirement
        for line in Path('requirements.in').read_text().splitlines():
            line = line.split('#', 1)[0].strip()
            if not line:
                continue
            req = Requirement(line)
            if req.marker is None or req.marker.evaluate():
                assert version(req.name) in req.specifier, f"Regenerate requirements.txt for {req}"
        PYLOCK

    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium

    - name: Run all tests with parallel runner
      run: |
        chmod +x ./run_all_tests.sh
        ./run_all_tests.sh
      env:
        CI: true

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          screenshots/
          test-results/
          *.log
          *.db
        retention-days: 7

  docker-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11.17"

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install -e .
        python - <<'PYLOCK'
        from importlib.metadata import version
        from pathlib import Path
        from pip._vendor.packaging.requirements import Requirement
        for line in Path('requirements.in').read_text().splitlines():
            line = line.split('#', 1)[0].strip()
            if not line:
                continue
            req = Requirement(line)
            if req.marker is None or req.marker.evaluate():
                assert version(req.name) in req.specifier, f"Regenerate requirements.txt for {req}"
        PYLOCK
        python -m playwright install chromium

    - name: Run Docker integration tests
      run: |
        python -m pytest tests/specialized/test_docker_integration.py -v

